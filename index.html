<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fun Finder</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<script>
// Transformed manually (rather than via <script type="text/babel" src="app.jsx">)
// so the JSX runtime option below can be set explicitly. Babel's "react" preset
// silently changed its default runtime between major versions (classic ->
// automatic, which emits `import "react/jsx-runtime"` — invalid in a plain
// script, no bundler). Pin the version above AND set the option explicitly so
// this can't silently break again.
fetch("app.jsx")
  .then((r) => r.text())
  .then((code) => {
    const out = Babel.transform(code, {
      filename: "app.jsx",
      presets: [["react", { runtime: "classic" }]],
    }).code;
    const script = document.createElement("script");
    script.textContent = out;
    document.body.appendChild(script);
  });
</script>
</body>
</html>
