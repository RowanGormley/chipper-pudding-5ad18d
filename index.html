  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

cle><\u002Fsvg>Directions<\u002Fbutton>\n          <button onclick=\"{{ closeDetail }}\" style=\"flex-shrink: 0; cursor: pointer; border: 1px solid #e6ddcd; background: #fffdf8; color: #1a1a22; font-family: 'Fredoka'; font-weight: 600; font-size: 16px; padding: 15px 22px; border-radius: 16px;\" style-active=\"transform: scale(0.98);\">Close<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ===================== EDITORS ===================== -->\n    <sc-if value=\"{{ editorOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div onclick=\"{{ closeEditor }}\" style=\"position: absolute; inset: 0; z-index: 70; background: rgba(20,14,4,0.4); animation: ff-scrim 0.2s ease;\"><\u002Fdiv>\n    <div style=\"position: absolute; left: 0; right: 0; bottom: 0; z-index: 71; background: #fffdf8; border-radius: 28px 28px 0 0; padding: 10px 24px calc(26px + env(safe-area-inset-bottom)); animation: ff-sheet 0.3s cubic-bezier(0.22,1,0.36,1);\">\n      <div style=\"display: flex; justify-content: center; padding: 6px 0 16px;\"><div style=\"width: 42px; height: 5px; border-radius: 3px; background: #e2d8c6;\"><\u002Fdiv><\u002Fdiv>\n\n      <sc-if value=\"{{ editingLocation }}\" hint-placeholder-val=\"{{ false }}\">\n      <h3 style=\"font-family: 'Fredoka'; font-weight: 600; font-size: 21px; margin: 0 0 14px; color: #1a1a22;\">Where are you?<\u002Fh3>\n      <button onclick=\"{{ useGps }}\" style=\"width: 100%; cursor: pointer; border: 1.5px solid #ec6a1f; background: #fbe7d8; color: #c2591b; font-family: 'Fredoka'; font-weight: 600; font-size: 15.5px; padding: 14px; border-radius: 15px; display: flex; align-items: center; justify-content: center; gap: 9px; margin-bottom: 14px;\" style-active=\"transform: scale(0.985);\"><svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#ec6a1f\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 21s-7-6.3-7-11a7 7 0 0 1 14 0c0 4.7-7 11-7 11Z\"><\u002Fpath><circle cx=\"12\" cy=\"10\" r=\"2.6\"><\u002Fcircle><\u002Fsvg> Use my current location<\u002Fbutton>\n      <div style=\"display: flex; align-items: center; gap: 10px; margin-bottom: 14px;\"><div style=\"flex: 1; height: 1px; background: #ece3d3;\"><\u002Fdiv><span style=\"font-family: 'DM Mono'; font-size: 11px; color: #b5ab9a;\">or type it<\u002Fspan><div style=\"flex: 1; height: 1px; background: #ece3d3;\"><\u002Fdiv><\u002Fdiv>\n      <input value=\"{{ locDraft }}\" oninput=\"{{ onLocInput }}\" placeholder=\"City, neighbourhood or address\" style=\"width: 100%; font-family: 'Hanken Grotesk'; font-size: 16px; font-weight: 600; color: #1a1a22; padding: 15px 16px; border: 1.5px solid #e6ddcd; border-radius: 15px; background: #fdfaf3; outline: none;\" style-focus=\"border-color: #ec6a1f;\">\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ editingTime }}\" hint-placeholder-val=\"{{ false }}\">\n      <h3 style=\"font-family: 'Fredoka'; font-weight: 600; font-size: 21px; margin: 0 0 14px; color: #1a1a22;\">When?<\u002Fh3>\n      <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 10px;\">\n        <sc-for list=\"{{ periodChips }}\" as=\"p\" hint-placeholder-count=\"4\">\n          <button onclick=\"{{ p.onClick }}\" style=\"{{ p.style }}\">{{ p.label }}<span style=\"display:block; font-family:'DM Mono'; font-size:11px; font-weight:400; opacity:0.7; margin-top:3px;\">{{ p.hint }}<\u002Fspan><\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ editingWalk }}\" hint-placeholder-val=\"{{ false }}\">\n      <h3 style=\"font-family: 'Fredoka'; font-weight: 600; font-size: 21px; margin: 0 0 6px; color: #1a1a22;\">How far will you walk?<\u002Fh3>\n      <div style=\"text-align: center; font-family: 'Fredoka'; font-weight: 600; font-size: 40px; color: #ec6a1f; margin: 10px 0 4px;\">{{ walkDraft }}<span style=\"font-size: 18px; color: #9a9082; font-weight: 500;\"> min<\u002Fspan><\u002Fdiv>\n      <input type=\"range\" min=\"5\" max=\"45\" step=\"5\" value=\"{{ walkDraft }}\" oninput=\"{{ onWalkInput }}\" style=\"width: 100%; accent-color: #ec6a1f; height: 30px;\">\n      <div style=\"display: flex; justify-content: space-between; font-family: 'DM Mono'; font-size: 11px; color: #b5ab9a; margin-top: -2px;\"><span>5 min<\u002Fspan><span>45 min<\u002Fspan><\u002Fdiv>\n      <\u002Fsc-if>\n\n      <button onclick=\"{{ applyEditor }}\" style=\"width: 100%; cursor: pointer; border: none; background: #17171f; color: #fffdf8; font-family: 'Fredoka'; font-weight: 600; font-size: 17px; padding: 16px; border-radius: 18px; margin-top: 22px;\" style-active=\"transform: scale(0.985);\">Update recommendations<\u002Fbutton>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;: {&quot;width&quot;: 428, &quot;height&quot;: 924}, &quot;accentColor&quot;: {&quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#ec6a1f&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Theme&quot;}, &quot;defaultWalkMins&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 20, &quot;min&quot;: 5, &quot;max&quot;: 45, &quot;step&quot;: 5, &quot;unit&quot;: &quot;min&quot;, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Behaviour&quot;}, &quot;aiPersonalization&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Behaviour&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    const saved = this.load();\n    const now = new Date();\n    this.coords = saved.coords || null;\n    this.state = {\n      screen: \"home\",\n      likes: saved.likes || [\"Coffee shops\", \"Hidden bars\", \"Architecture\", \"Local markets\", \"History\", \"Quiet spots\"],\n      dislikes: saved.dislikes || [\"Tourist traps\", \"Loud crowds\", \"Chain restaurants\", \"Long queues\"],\n      location: saved.location || \"\",\n      walkMins: saved.walkMins || (this.props.defaultWalkMins ?? 20),\n      period: saved.period || this.periodForHour(now.getHours()),\n      clock: now,\n      category: \"All\",\n      view: \"list\",\n      routing: false,\n      route: [],\n      recs: null,\n      recsLoading: false,\n      recsError: null,\n      selected: null,\n      editor: null,\n      locDraft: \"\",\n      walkDraft: 20,\n      mapSel: null,\n      whats: \"intro\",\n      whatsResult: null,\n      whatsPhoto: null,\n      camError: null,\n      loadingText: \"Finding the good stuff nearby…\",\n    };\n    this.PLACES = [];\n    this.CATS = [\"All\", \"Cafés\", \"Bars\", \"Food\", \"Culture\", \"Outdoors\", \"Music\", \"Shops\"];\n    this.TINT = {\n      \"Cafés\": \"oklch(0.9 0.055 70)\",\n      \"Bars\": \"oklch(0.89 0.06 22)\",\n      \"Food\": \"oklch(0.9 0.07 48)\",\n      \"Culture\": \"oklch(0.9 0.045 305)\",\n      \"Outdoors\": \"oklch(0.9 0.06 145)\",\n      \"Music\": \"oklch(0.89 0.06 32)\",\n      \"Shops\": \"oklch(0.91 0.05 92)\",\n    };\n  }\n\n  componentDidMount() {\n    this.timer = setInterval(() => this.setState({ clock: new Date() }), 30000);\n  }\n  componentWillUnmount() {\n    clearInterval(this.timer);\n    this.stopCam();\n    if (this._map) { this._map.remove(); this._map = null; }\n  }\n  componentDidUpdate(pp, ps) {\n    if (this._map) {\n      const s = this.state;\n      if (ps.recs !== s.recs || ps.category !== s.category || ps.route !== s.route || ps.routing !== s.routing || ps.mapSel !== s.mapSel) {\n        this.renderMarkers();\n      }\n    }\n  }\n\n  // ---------- persistence ----------\n  load() { try { return JSON.parse(localStorage.getItem(\"funfinder.v2\")) || {}; } catch (e) { return {}; } }\n  save() {\n    const s = this.state;\n    const data = { likes: s.likes, dislikes: s.dislikes, location: s.location, walkMins: s.walkMins, period: s.period, coords: this.coords };\n    try { localStorage.setItem(\"funfinder.v2\", JSON.stringify(data)); } catch (e) {}\n  }\n\n  // ---------- time helpers ----------\n  periodForHour(h) { if (h < 12) return \"morning\"; if (h < 17) return \"afternoon\"; if (h < 22) return \"evening\"; return \"late night\"; }\n  fmtTime(d) { return String(d.getHours()).padStart(2, \"0\") + \":\" + String(d.getMinutes()).padStart(2, \"0\"); }\n  weekday(d) { return [\"Sunday\", \"Monday\", \"Tuesday\", \"Wednesday\", \"Thursday\", \"Friday\", \"Saturday\"][d.getDay()]; }\n\n  // ---------- geo helpers ----------\n  distMeters(a, b, c, d) {\n    const R = 6371000, toR = x => x * Math.PI / 180;\n    const dLat = toR(c - a), dLon = toR(d - b);\n    const s = Math.sin(dLat / 2) ** 2 + Math.cos(toR(a)) * Math.cos(toR(c)) * Math.sin(dLon / 2) ** 2;\n    return 2 * R * Math.asin(Math.sqrt(s));\n  }\n  cap(x) { return x ? x.charAt(0).toUpperCase() + x.slice(1) : x; }\n\n  classify(t) {\n    const a = t.amenity, to = t.tourism, l = t.leisure, h = t.historic, sh = t.shop;\n    if (a === \"cafe\" || a === \"ice_cream\") return { category: \"Cafés\", type: a === \"ice_cream\" ? \"Ice cream\" : \"Café\", tags: [\"Coffee shops\", \"Quiet spots\"] };\n    if (a === \"bar\" || a === \"pub\" || a === \"biergarten\") return { category: \"Bars\", type: a === \"pub\" ? \"Pub\" : \"Bar\", tags: [\"Hidden bars\", \"Nightlife\", \"Craft beer\"] };\n    if (a === \"nightclub\") return { category: \"Music\", type: \"Nightclub\", tags: [\"Nightlife\", \"Live music\", \"Late nights\"] };\n    if (a === \"restaurant\") return { category: \"Food\", type: \"Restaurant\", tags: [\"Fine dining\", \"Street food\"] };\n    if (a === \"fast_food\" || a === \"food_court\") return { category: \"Food\", type: \"Casual eats\", tags: [\"Street food\"] };\n    if (a === \"marketplace\") return { category: \"Food\", type: \"Market\", tags: [\"Local markets\", \"Street food\", \"People watching\"] };\n    if (a === \"theatre\" || a === \"arts_centre\") return { category: \"Culture\", type: \"Theatre\", tags: [\"Live music\", \"History\"] };\n    if (a === \"cinema\") return { category: \"Culture\", type: \"Cinema\", tags: [\"Nightlife\"] };\n    if (to === \"museum\") return { category: \"Culture\", type: \"Museum\", tags: [\"Museums\", \"History\", \"Art galleries\"] };\n    if (to === \"gallery\" || to === \"artwork\") return { category: \"Culture\", type: to === \"artwork\" ? \"Public art\" : \"Gallery\", tags: [\"Art galleries\", \"Street art\"] };\n    if (to === \"viewpoint\") return { category: \"Outdoors\", type: \"Viewpoint\", tags: [\"Rooftop views\", \"Quiet spots\"] };\n    if (to === \"attraction\" || to === \"theme_park\" || to === \"zoo\" || to === \"aquarium\") return { category: \"Culture\", type: this.cap(to.replace(/_/g, \" \")), tags: [\"People watching\", \"History\"] };\n    if (l === \"park\" || l === \"garden\" || l === \"nature_reserve\") return { category: \"Outdoors\", type: l === \"garden\" ? \"Garden\" : \"Park\", tags: [\"Parks & gardens\", \"Quiet spots\", \"People watching\"] };\n    if (l === \"marina\") return { category: \"Outdoors\", type: \"Marina\", tags: [\"Quiet spots\", \"People watching\"] };\n    if (h) return { category: \"Culture\", type: this.cap(String(h).replace(/_/g, \" \")), tags: [\"History\", \"Architecture\", \"Quiet spots\"] };\n    if (sh === \"books\") return { category: \"Shops\", type: \"Bookshop\", tags: [\"Bookshops\", \"Quiet spots\"] };\n    if (sh === \"art\") return { category: \"Shops\", type: \"Art shop\", tags: [\"Art galleries\", \"Vintage shops\"] };\n    if (sh === \"music\") return { category: \"Shops\", type: \"Record shop\", tags: [\"Vintage shops\", \"Nightlife\"] };\n    if (sh) return { category: \"Shops\", type: \"Shop\", tags: [\"Vintage shops\", \"Local markets\"] };\n    return { category: \"Culture\", type: \"Spot\", tags: [\"People watching\"] };\n  }\n\n  async fetchPlaces(lat, lon) {\n    const R = Math.min(3500, Math.max(400, Math.round(this.state.walkMins * 85)));\n    const q = `[out:json][timeout:25];(` +\n      `nwr[\"amenity\"~\"^(cafe|bar|pub|biergarten|restaurant|fast_food|ice_cream|marketplace|theatre|cinema|arts_centre|nightclub)$\"][\"name\"](around:${R},${lat},${lon});` +\n      `nwr[\"tourism\"~\"^(museum|gallery|artwork|attraction|viewpoint|zoo|aquarium|theme_park)$\"][\"name\"](around:${R},${lat},${lon});` +\n      `nwr[\"leisure\"~\"^(park|garden|nature_reserve|marina)$\"][\"name\"](around:${R},${lat},${lon});` +\n      `nwr[\"historic\"][\"name\"](around:${R},${lat},${lon});` +\n      `nwr[\"shop\"~\"^(books|art|music|gift|craft|antiques|second_hand)$\"][\"name\"](around:${R},${lat},${lon});` +\n      `);out center 400;`;\n    const res = await fetch(\"https://overpass-api.de/api/interpreter\", { method: \"POST\", body: \"data=\" + encodeURIComponent(q) });\n    if (!res.ok) throw new Error(\"overpass \" + res.status);\n    const json = await res.json();\n    const seen = new Set();\n    const out = [];\n    for (const el of (json.elements || [])) {\n      const t = el.tags; if (!t || !t.name) continue;\n      const plat = el.lat != null ? el.lat : (el.center && el.center.lat);\n      const plon = el.lon != null ? el.lon : (el.center && el.center.lon);\n      if (plat == null || plon == null) continue;\n      const key = t.name.toLowerCase();\n      if (seen.has(key)) continue;\n      const meters = this.distMeters(lat, lon, plat, plon);\n      const walkMins = Math.max(1, Math.round(meters / 80));\n      const cl = this.classify(t);\n      seen.add(key);\n      out.push({\n        id: el.type + \"/\" + el.id,\n        name: t.name,\n        category: cl.category,\n        type: cl.type,\n        tags: cl.tags,\n        walkMins, meters,\n        lat: plat, lon: plon,\n        area: t[\"addr:suburb\"] || t[\"addr:neighbourhood\"] || t[\"addr:city\"] || \"\",\n        hoursLabel: t.opening_hours || \"\",\n        caption: cl.type.toLowerCase(),\n        blurb: t.description || \"\",\n        website: t.website || t[\"contact:website\"] || \"\",\n      });\n    }\n    out.sort((a, b) => a.meters - b.meters);\n    return out.slice(0, 60);\n  }\n\n  async reverseGeocode(lat, lon) {\n    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=14&addressdetails=1&lat=${lat}&lon=${lon}`);\n    const j = await r.json();\n    const a = j.address || {};\n    const name = a.neighbourhood || a.suburb || a.quarter || a.city_district || a.town || a.village || a.city || a.county || \"Your location\";\n    const city = a.city || a.town || a.village || a.county || \"\";\n    return city && name !== city ? `${name}, ${city}` : name;\n  }\n  async geocode(query) {\n    const r = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&addressdetails=1&q=${encodeURIComponent(query)}`);\n    const j = await r.json();\n    if (!j.length) return null;\n    const hit = j[0];\n    const a = hit.address || {};\n    const name = a.neighbourhood || a.suburb || a.city || a.town || a.village || (hit.display_name || query).split(\",\")[0];\n    const city = a.city || a.town || a.village || \"\";\n    return { lat: parseFloat(hit.lat), lon: parseFloat(hit.lon), name: city && name !== city ? `${name}, ${city}` : name };\n  }\n\n  // ---------- top-level flow ----------\n  onUseLocation() {\n    if (this.PLACES.length && this.coords) { this.buildRecs(); return; }\n    this.locateAndFetch();\n  }\n  locateAndFetch() {\n    this.setState({ screen: \"recs\", recsLoading: true, recsError: null, recs: null, view: \"list\", mapSel: null, route: [], routing: false, loadingText: \"Finding where you are…\" });\n    if (!navigator.geolocation) { this.geoFail(); return; }\n    navigator.geolocation.getCurrentPosition(\n      async (pos) => {\n        this.coords = { lat: pos.coords.latitude, lon: pos.coords.longitude };\n        try { const nm = await this.reverseGeocode(this.coords.lat, this.coords.lon); this.setState({ location: nm }); } catch (e) {}\n        this.save();\n        this.fetchThenRecs();\n      },\n      () => this.geoFail(),\n      { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 }\n    );\n  }\n  geoFail() {\n    this.setState({ recsLoading: false, recsError: \"Couldn't get your location — allow location access, or type where you are. (Location needs a secure https connection.)\" });\n  }\n  async fetchThenRecs() {\n    if (!this.coords) { this.geoFail(); return; }\n    this.setState({ recsLoading: true, recsError: null, loadingText: \"Looking for good things nearby…\" });\n    try {\n      const places = await this.fetchPlaces(this.coords.lat, this.coords.lon);\n      this.PLACES = places;\n      if (!places.length) {\n        this.setState({ recsLoading: false, recsError: \"Nothing much turned up within your walking range. Try widening the distance or another spot.\" });\n        return;\n      }\n      this.buildRecs();\n    } catch (e) {\n      console.warn(\"fetch places failed\", e);\n      this.setState({ recsLoading: false, recsError: \"Couldn't reach the places service. Check your connection and try again.\" });\n    }\n  }\n\n  // ---------- navigation ----------\n  back() { this.setState({ screen: \"home\", editor: null, selected: null }); }\n\n  // ---------- route building ----------\n  toggleRoute() { this.setState(s => ({ routing: !s.routing, mapSel: null })); }\n  addToRoute(p) {\n    this.setState(s => {\n      const has = s.route.includes(p.id);\n      return { route: has ? s.route.filter(x => x !== p.id) : [...s.route, p.id] };\n    });\n  }\n  clearRoute() { this.setState({ route: [] }); }\n  startRoute() {\n    const places = this.state.route.map(id => this.PLACES.find(p => p.id === id)).filter(Boolean);\n    if (!places.length) return;\n    const pt = p => `${p.lat},${p.lon}`;\n    const dest = pt(places[places.length - 1]);\n    const way = places.slice(0, -1).map(pt).join(\"|\");\n    let url = `https://www.google.com/maps/dir/?api=1&travelmode=walking&destination=${dest}`;\n    if (way) url += `&waypoints=${encodeURIComponent(way)}`;\n    window.open(url, \"_blank\");\n  }\n\n  // ---------- preferences ----------\n  toggle(kind, label) {\n    this.setState(s => {\n      const arr = s[kind].includes(label) ? s[kind].filter(x => x !== label) : [...s[kind], label];\n      return { [kind]: arr };\n    }, () => this.save());\n  }\n\n  // ---------- recommendations ----------\n  eligible() {\n    const within = this.PLACES.filter(p => p.walkMins <= this.state.walkMins);\n    return within.length >= 5 ? within : [...this.PLACES].sort((a, b) => a.walkMins - b.walkMins).slice(0, Math.min(8, this.PLACES.length));\n  }\n  matchScore(p) {\n    const L = this.state.likes, D = this.state.dislikes;\n    let s = 0;\n    p.tags.forEach(t => { if (L.includes(t)) s += 2; if (D.includes(t)) s -= 3; });\n    return s;\n  }\n  fallbackRecs() {\n    const ranked = this.eligible()\n      .map(p => ({ p, score: this.matchScore(p) }))\n      .sort((a, b) => (b.score - a.score) || (a.p.walkMins - b.p.walkMins))\n      .slice(0, 5);\n    return ranked.map(({ p }) => {\n      const liked = p.tags.find(t => this.state.likes.includes(t));\n      const why = liked ? `Right up your street — you're into ${liked.toLowerCase()}.` : `A ${p.type.toLowerCase()} a short walk away.`;\n      const blurb = p.blurb || `A ${p.type.toLowerCase()}${p.area ? \" in \" + p.area : \"\"}, roughly ${p.walkMins} minutes on foot from you.`;\n      return { ...p, why, blurb };\n    });\n  }\n\n  async buildRecs() {\n    this.setState({ screen: \"recs\", recsLoading: true, recsError: null, recs: null, selected: null, category: \"All\", route: [], routing: false, mapSel: null, loadingText: \"Picking your 5 best…\" });\n    const aiOn = this.props.aiPersonalization ?? true;\n    if (!aiOn) { setTimeout(() => this.setState({ recs: this.fallbackRecs(), recsLoading: false }), 400); return; }\n\n    const s = this.state;\n    const list = this.eligible().map(p => ({ id: p.id, name: p.name, type: p.type, category: p.category, tags: p.tags, walkMins: p.walkMins, openingHours: p.hoursLabel || null }));\n    const prompt = `You are a sharp local guide near ${s.location || \"the traveller's location\"}. Pick the 5 BEST things for this traveller RIGHT NOW and rank them best-first.\n\nTime: ${this.weekday(s.clock)} ${s.period}, about ${this.fmtTime(s.clock)}\nMax walk: ${s.walkMins} minutes\nThey LIKE: ${s.likes.join(\", \")}\nThey DISLIKE: ${s.dislikes.join(\", \")}\n\nCandidate places (JSON, openingHours is raw OSM opening_hours syntax or null):\n${JSON.stringify(list)}\n\nRules:\n- If openingHours is given, prefer places likely OPEN at the current time; avoid ones likely closed.\n- Favour their likes; avoid anything clashing with dislikes.\n- \"why\": one warm, specific sentence (max 18 words) referencing the time of day and/or a like. Talk to them (\"you\").\n- \"blurb\": 1-2 inviting sentences (max ~35 words) describing the place.\nReturn ONLY a JSON array of exactly 5 objects: [{\"id\":\"...\",\"why\":\"...\",\"blurb\":\"...\"}]. No markdown.`;\n\n    try {\n      const raw = await window.claude.complete({ messages: [{ role: \"user\", content: prompt }], max_tokens: 1200 });\n      const m = raw.match(/\\[[\\s\\S]*\\]/);\n      const picks = JSON.parse(m ? m[0] : raw);\n      const byId = Object.fromEntries(this.PLACES.map(p => [p.id, p]));\n      const recs = picks.map(pk => byId[pk.id] ? { ...byId[pk.id], why: pk.why, blurb: pk.blurb || byId[pk.id].blurb || \"\" } : null).filter(Boolean).slice(0, 5);\n      if (recs.length < 3) throw new Error(\"too few\");\n      this.setState({ recs, recsLoading: false });\n    } catch (e) {\n      console.warn(\"AI recs failed, using fallback\", e);\n      this.setState({ recs: this.fallbackRecs(), recsLoading: false });\n    }\n  }\n\n  // ---------- camera ----------\n  videoRef(el) {\n    this._video = el;\n    if (el) {\n      el.muted = true; el.playsInline = true;\n      el.setAttribute(\"playsinline\", \"\"); el.setAttribute(\"autoplay\", \"\");\n      if (this._stream) { el.srcObject = this._stream; el.play().catch(() => {}); }\n    }\n  }\n  async openCamera() {\n    this.setState({ whats: \"camera\", whatsResult: null, whatsPhoto: null, camError: null });\n    try {\n      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: \"environment\" } }, audio: false });\n      this._stream = stream;\n      if (this._video) { this._video.srcObject = stream; this._video.play().catch(() => {}); }\n    } catch (e) {\n      this.stopCam();\n      this.setState({ whats: \"intro\", camError: \"Camera unavailable — allow camera access. (Camera needs a secure https connection.)\" });\n    }\n  }\n  stopCam() { if (this._stream) { this._stream.getTracks().forEach(t => t.stop()); this._stream = null; } }\n  capturePhoto() {\n    const v = this._video;\n    let url = null;\n    if (v && v.videoWidth) {\n      const cv = document.createElement(\"canvas\");\n      cv.width = v.videoWidth; cv.height = v.videoHeight;\n      cv.getContext(\"2d\").drawImage(v, 0, 0, cv.width, cv.height);\n      url = cv.toDataURL(\"image/jpeg\", 0.8);\n    }\n    this.stopCam();\n    this.setState({ whats: \"loading\", whatsPhoto: url });\n    this.simulateId();\n  }\n  async simulateId() {\n    const loc = this.state.location || \"your area\";\n    const fallback = {\n      title: \"Simulated result\",\n      type: \"Demo mode\",\n      blurb: `This is a preview of the scanner. With a vision-enabled key it would identify whatever you point at around ${loc}.`,\n      facts: [\"Point at a building, dish, statue or sign.\", \"Real identification needs a vision API key.\", \"The photo above is real — this text is a placeholder.\"],\n    };\n    try {\n      const raw = await window.claude.complete({\n        messages: [{ role: \"user\", content: `Write a SHORT playful EXAMPLE of what a \"point your camera at a landmark\" scanner might say for a traveller near ${loc}. It is clearly a demo. Reply ONLY JSON: {\"title\":\"a plausible well-known sight near ${loc}\",\"type\":\"short label with era or category\",\"blurb\":\"2 warm sentences ~35 words\",\"facts\":[\"3 short punchy facts\"]}` }],\n        max_tokens: 500,\n      });\n      const m = raw.match(/\\{[\\s\\S]*\\}/);\n      const r = JSON.parse(m ? m[0] : raw);\n      if (!r.title || !Array.isArray(r.facts)) throw new Error(\"bad\");\n      setTimeout(() => this.setState({ whats: \"result\", whatsResult: r }), 900);\n    } catch (e) {\n      setTimeout(() => this.setState({ whats: \"result\", whatsResult: fallback }), 900);\n    }\n  }\n\n  // ---------- editors ----------\n  openEditor(kind) {\n    this.setState({ editor: kind, locDraft: this.state.location, walkDraft: this.state.walkMins });\n  }\n  useGpsFromEditor() {\n    this.setState({ editor: null });\n    this.coords = null; this.PLACES = [];\n    this.locateAndFetch();\n  }\n  applyEditor() {\n    const k = this.state.editor;\n    if (k === \"location\") {\n      const q = (this.state.locDraft || \"\").trim();\n      this.setState({ editor: null });\n      if (q) this.geocodeThenFetch(q);\n      return;\n    }\n    if (k === \"time\") { this.setState({ editor: null }, () => { this.save(); this.buildRecs(); }); return; }\n    if (k === \"walk\") { this.setState({ walkMins: this.state.walkDraft, editor: null }, () => { this.save(); this.fetchThenRecs(); }); return; }\n  }\n  async geocodeThenFetch(q) {\n    this.setState({ screen: \"recs\", recsLoading: true, recsError: null, recs: null, view: \"list\", loadingText: \"Finding that place…\" });\n    try {\n      const g = await this.geocode(q);\n      if (!g) { this.setState({ recsLoading: false, recsError: \"Couldn't find that place. Try a more specific name.\" }); return; }\n      this.coords = { lat: g.lat, lon: g.lon };\n      this.PLACES = [];\n      this.setState({ location: g.name || q }, () => this.save());\n      this.fetchThenRecs();\n    } catch (e) {\n      this.setState({ recsLoading: false, recsError: \"Location lookup failed. Try again.\" });\n    }\n  }\n\n  // ---------- leaflet map ----------\n  setMapEl(el) {\n    if (!el) { if (this._map) { this._map.remove(); this._map = null; this._layer = null; } return; }\n    if (this._map) return;\n    this._mapEl = el;\n    this.initMap();\n  }\n  initMap() {\n    if (!window.L) { this._mapWait = (this._mapWait || 0) + 1; if (this._mapWait < 40) setTimeout(() => this.initMap(), 150); return; }\n    if (!this._mapEl || this._map) return;\n    const c = this.coords || { lat: 41.3851, lon: 2.1734 };\n    this._map = window.L.map(this._mapEl, { zoomControl: false, attributionControl: true }).setView([c.lat, c.lon], 15);\n    window.L.tileLayer(\"https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png\", { maxZoom: 19, attribution: \"© OpenStreetMap © CARTO\" }).addTo(this._map);\n    setTimeout(() => { if (this._map) this._map.invalidateSize(); }, 120);\n    this.renderMarkers();\n  }\n  renderMarkers() {\n    const L = window.L;\n    if (!this._map || !L) return;\n    if (this._layer) this._layer.remove();\n    this._layer = L.layerGroup().addTo(this._map);\n    const accent = this.props.accentColor ?? \"#ec6a1f\";\n    const s = this.state;\n    if (this.coords) {\n      L.marker([this.coords.lat, this.coords.lon], { icon: L.divIcon({ className: \"\", html: `<div style=\"width:18px;height:18px;border-radius:50%;background:#2a6fdb;border:3px solid #fff;box-shadow:0 0 0 5px rgba(42,111,219,0.22);\"><\u002Fdiv>`, iconSize: [18, 18], iconAnchor: [9, 9] }), interactive: false }).addTo(this._layer);\n    }\n    const allRecs = s.recs || [];\n    const filtered = s.category === \"All\" ? allRecs : allRecs.filter(p => p.category === s.category);\n    const routeMode = s.routing;\n    const bounds = [];\n    if (this.coords) bounds.push([this.coords.lat, this.coords.lon]);\n    filtered.forEach(p => {\n      const rank = allRecs.indexOf(p) + 1;\n      const routeIdx = s.route.indexOf(p.id);\n      const inRoute = routeIdx >= 0;\n      const hl = routeMode ? inRoute : (s.mapSel && s.mapSel.id === p.id);\n      const size = hl ? 38 : 30;\n      const bg = hl ? accent : (routeMode ? \"#8a8275\" : \"#17171f\");\n      const label = routeMode ? (inRoute ? String(routeIdx + 1) : \"+\") : String(rank);\n      const html = `<div style=\"width:${size}px;height:${size}px;border-radius:50%;background:${bg};border:${hl ? 3 : 2.5}px solid #fffdf8;box-shadow:0 6px 14px -4px rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;font-family:'Fredoka',sans-serif;font-weight:600;font-size:${hl ? 15 : 13}px;color:#fffdf8;\">${label}<\u002Fdiv>`;\n      const m = L.marker([p.lat, p.lon], { icon: L.divIcon({ className: \"\", html, iconSize: [size, size], iconAnchor: [size / 2, size / 2] }), zIndexOffset: hl ? 1000 : 0 }).addTo(this._layer);\n      m.on(\"click\", () => routeMode ? this.addToRoute(p) : this.setState({ mapSel: p }));\n      bounds.push([p.lat, p.lon]);\n    });\n    if (routeMode) {\n      const pts = s.route.map(id => allRecs.find(p => p.id === id)).filter(Boolean).map(p => [p.lat, p.lon]);\n      if (pts.length >= 2) L.polyline(pts, { color: accent, weight: 3.5, dashArray: \"2 9\", lineCap: \"round\" }).addTo(this._layer);\n    }\n    if (!this._fitted && bounds.length >= 2) {\n      try { this._map.fitBounds(bounds, { padding: [50, 50], maxZoom: 16 }); this._fitted = true; } catch (e) {}\n    }\n  }\n\n  // ---------- style helpers ----------\n  chipStyle(active, tone) {\n    const base = \"cursor:pointer; font-family:'Hanken Grotesk'; font-weight:600; font-size:14px; padding:9px 15px; border-radius:22px; border:1px solid; transition:transform .08s;\";\n    if (active && tone === \"like\") return base + \"background:#ec6a1f; color:#fffdf8; border-color:#ec6a1f;\";\n    if (active && tone === \"dislike\") return base + \"background:#17171f; color:#fffdf8; border-color:#17171f;\";\n    return base + \"background:#f6efe3; color:#8a8275; border-color:#ece3d3;\";\n  }\n  tabStyle(active) {\n    const base = \"cursor:pointer; flex-shrink:0; font-family:'DM Mono'; font-weight:500; font-size:13px; padding:8px 15px; border-radius:20px; border:1px solid;\";\n    return active ? base + \"background:#17171f; color:#fffdf8; border-color:#17171f;\" : base + \"background:#fffdf8; color:#8a8275; border-color:#eadfce;\";\n  }\n  toggleBtn(active) {\n    const base = \"cursor:pointer; border:none; height:32px; padding:0 13px; border-radius:15px; display:flex; align-items:center; gap:6px; font-family:'DM Mono'; font-weight:500; font-size:12.5px;\";\n    return active ? base + \"background:#fffdf8; color:#17171f;\" : base + \"background:transparent; color:#b7ab9b;\";\n  }\n  imgBg(cat) { const t = this.TINT[cat] || \"oklch(0.9 0.05 70)\"; return `linear-gradient(150deg, ${t}, oklch(0.86 0.04 60))`; }\n\n  // ---------- render ----------\n  cardFor(p, i) {\n    return {\n      ...p,\n      rank: i + 1,\n      imgBg: this.imgBg(p.category),\n      metaLine: `${p.category} · ${p.walkMins} min walk${p.area ? \" · \" + p.area : \"\"}`,\n      walkLabel: `${p.walkMins} min walk`,\n      categoryLabel: p.category,\n      typeArea: p.area ? `${p.type} · ${p.area}` : p.type,\n      hasHours: !!p.hoursLabel,\n      onClick: () => this.setState({ selected: p }),\n      directions: (e) => { if (e && e.stopPropagation) e.stopPropagation(); const q = p.lat != null ? `${p.lat},${p.lon}` : encodeURIComponent(p.name); window.open(`https://www.google.com/maps/dir/?api=1&travelmode=walking&destination=${q}`, \"_blank\"); },\n    };\n  }\n\n  renderVals() {\n    const s = this.state;\n    const clock = s.clock;\n    const statusTime = this.fmtTime(clock);\n\n    const allRecs = s.recs || [];\n    const filtered = s.category === \"All\" ? allRecs : allRecs.filter(p => p.category === s.category);\n    const cards = filtered.map(p => this.cardFor(p, allRecs.indexOf(p)));\n\n    const present = new Set(allRecs.map(p => p.category));\n    const tabList = [\"All\", ...this.CATS.filter(c => c !== \"All\" && present.has(c))];\n    const tabs = (tabList.length > 1 ? tabList : [\"All\"]).map(label => ({\n      label, style: this.tabStyle(s.category === label), onClick: () => this.setState({ category: label, mapSel: null }),\n    }));\n\n    const routePlaces = s.route.map(id => allRecs.find(p => p.id === id)).filter(Boolean);\n    const routeStops = routePlaces.map((p, i) => ({ order: i + 1, name: p.name, walk: `${p.walkMins} min` }));\n\n    const mapSel = s.mapSel ? this.cardFor(s.mapSel, allRecs.indexOf(s.mapSel)) : null;\n\n    const detail = s.selected ? this.cardFor(s.selected, allRecs.indexOf(s.selected)) : null;\n\n    const likeMaster = [\"Live music\", \"Street food\", \"Museums\", \"Hidden bars\", \"Local markets\", \"Architecture\", \"Coffee shops\", \"Parks & gardens\", \"Art galleries\", \"Rooftop views\", \"Bookshops\", \"Nightlife\", \"History\", \"Craft beer\", \"Vintage shops\", \"Street art\", \"Fine dining\", \"Late nights\", \"Quiet spots\", \"People watching\"];\n    const dislikeMaster = [\"Tourist traps\", \"Loud crowds\", \"Chain restaurants\", \"Long queues\", \"Shopping malls\", \"Sports bars\", \"Fast food\", \"Karaoke\", \"Casinos\", \"Party hostels\", \"Early mornings\", \"Guided tours\", \"Theme parks\"];\n\n    const likeChips = likeMaster.map(l => ({ label: l, style: this.chipStyle(s.likes.includes(l), \"like\"), onClick: () => this.toggle(\"likes\", l) }));\n    const dislikeChips = dislikeMaster.map(l => ({ label: l, style: this.chipStyle(s.dislikes.includes(l), \"dislike\"), onClick: () => this.toggle(\"dislikes\", l) }));\n\n    const periods = [[\"morning\", \"6–12\"], [\"afternoon\", \"12–17\"], [\"evening\", \"17–22\"], [\"late night\", \"22–late\"]];\n    const periodChips = periods.map(([p, hint]) => ({\n      label: p.charAt(0).toUpperCase() + p.slice(1), hint,\n      style: (s.period === p\n        ? \"cursor:pointer; text-align:left; border:1.5px solid #ec6a1f; background:#fbe7d8; color:#c2591b; font-family:'Fredoka'; font-weight:600; font-size:16px; padding:14px 16px; border-radius:16px;\"\n        : \"cursor:pointer; text-align:left; border:1.5px solid #ece3d3; background:#f6efe3; color:#403b33; font-family:'Fredoka'; font-weight:600; font-size:16px; padding:14px 16px; border-radius:16px;\"),\n      onClick: () => this.setState({ period: p }),\n    }));\n\n    const walkText = `${s.walkMins} min walk`;\n    const whenText = `${statusTime} ${this.weekday(clock)} ${s.period}`;\n\n    return {\n      statusTime,\n      isHome: s.screen === \"home\", isAbout: s.screen === \"about\", isWhats: s.screen === \"whats\", isRecs: s.screen === \"recs\",\n      onUseLocation: () => this.onUseLocation(),\n      onWhats: () => this.setState({ screen: \"whats\", whats: \"intro\", camError: null }),\n      onAbout: () => this.setState({ screen: \"about\" }),\n      onBack: () => { this.stopCam(); this.back(); },\n\n      likeChips, dislikeChips,\n\n      whatsIntro: s.whats === \"intro\", whatsCamera: s.whats === \"camera\", whatsLoading: s.whats === \"loading\", whatsDone: s.whats === \"result\",\n      whatsResult: s.whatsResult || { title: \"\", type: \"\", blurb: \"\", facts: [] },\n      whatsPhoto: s.whatsPhoto || \"\",\n      camError: !!s.camError, camErrorText: s.camError || \"\",\n      onOpenCamera: () => this.openCamera(),\n      videoRef: (el) => this.videoRef(el),\n      onCapture: () => this.capturePhoto(),\n\n      locationText: s.location ? s.location.split(\",\")[0] : \"Set location\", whenText, walkText,\n      editLocation: () => this.openEditor(\"location\"),\n      editTime: () => this.openEditor(\"time\"),\n      editWalk: () => this.openEditor(\"walk\"),\n\n      tabs,\n      listBtnStyle: this.toggleBtn(s.view === \"list\"), mapBtnStyle: this.toggleBtn(s.view === \"map\"),\n      showList: () => this.setState({ view: \"list\" }),\n      showMap: () => { this._fitted = false; this.setState({ view: \"map\", mapSel: allRecs[0] || null }); },\n\n      recsLoading: s.recsLoading, loadingText: s.loadingText,\n      recsError: !!s.recsError, errorText: s.recsError || \"\",\n      retry: () => (this.coords ? this.fetchThenRecs() : this.locateAndFetch()),\n      showListView: !s.recsLoading && !s.recsError && s.view === \"list\",\n      showMapView: !s.recsLoading && !s.recsError && s.view === \"map\",\n      cards,\n      resultsFootnote: s.category === \"All\" ? `${allRecs.length} picks · tuned to your taste` : `${cards.length} in ${s.category}`,\n      mapRef: (el) => this.setMapEl(el),\n      mapSelected: mapSel || {},\n      mapMiniShow: !s.routing && !!mapSel,\n      routeToggleLabel: s.routing ? \"Done\" : \"Build route\",\n      routeToggleStyle: \"position:absolute; top:12px; left:12px; z-index:500; cursor:pointer; display:inline-flex; align-items:center; gap:7px; padding:9px 14px; border-radius:16px; font-family:'Fredoka'; font-weight:600; font-size:13.5px; border:none; box-shadow:0 6px 16px -6px rgba(40,28,12,0.5); \" + (s.routing ? \"background:#ec6a1f; color:#fffdf8;\" : \"background:#fffdf8; color:#1a1a22;\"),\n      toggleRoute: () => this.toggleRoute(),\n      routePanelShow: s.routing,\n      routeEmpty: routeStops.length === 0,\n      routeHasStops: routeStops.length > 0,\n      routeStops, routeCount: routeStops.length,\n      clearRoute: () => this.clearRoute(),\n      startRoute: () => this.startRoute(),\n      clearRouteStyle: \"cursor:pointer; border:1px solid #eadfce; background:#fffdf8; color:#9a9082; font-family:'DM Mono'; font-size:11.5px; padding:5px 11px; border-radius:12px;\" + (routeStops.length ? \"\" : \" opacity:0.5; pointer-events:none;\"),\n\n      detailOpen: !!s.selected, detail: detail || {},\n      closeDetail: () => this.setState({ selected: null }),\n\n      editorOpen: !!s.editor,\n      editingLocation: s.editor === \"location\", editingTime: s.editor === \"time\", editingWalk: s.editor === \"walk\",\n      closeEditor: () => this.setState({ editor: null }),\n      applyEditor: () => this.applyEditor(),\n      useGps: () => this.useGpsFromEditor(),\n      locDraft: s.locDraft, onLocInput: (e) => this.setState({ locDraft: e.target.value }),\n      walkDraft: s.walkDraft, onWalkInput: (e) => this.setState({ walkDraft: parseInt(e.target.value, 10) }),\n      periodChips,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
